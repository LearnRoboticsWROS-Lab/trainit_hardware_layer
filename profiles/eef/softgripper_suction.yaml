# Profile — SoftGripper body with the claws removed + central suction cup, fused into
# one rigid block. Realises contracts/gripper.md.

role: end_effector
model: softgripper_suction
kind: suction

description:
  package: fr5_app
  xacro: urdf/suction_cup.xacro
  macro: suction_cup
  mount_link: tool0          # identity mount: mesh authored flange-at-origin, +Z approach
  tip_frame: tcp

state:
  # robot-description compatibility state for TF/MoveIt; never grasp or release evidence
  # (ADR-0022, owner §18)
  joint: suctioncup_joint    # 0 = open, 1 = closed
  mass_kg: 0.4

backends:
  mock:  {package: null, note: "legacy: generated by TSA; a canonical project uses the trainit_mock row"}
  # ADR-0022 D6: a reference to an adapter row, the one source for what serves the canonical
  # contract in this mode. A legacy project still runs the cell's own bridge (legacy below).
  isaac: {row: trainit_isaac_surface_gripper,
          legacy: {package: fr3wml_isaac, executable: isaac_suction_bridge.py,
                   isaac_side: surface_gripper}}
  real:  {package: fairino_gripper, executable: fairino_gripper_suction_control.py}
